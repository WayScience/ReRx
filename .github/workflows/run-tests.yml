---
# used for running tests
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pre_commit_checks:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      # checks out the repo
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # run pre-commit
      - name: Python setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.0.1
      # use prek for speedy precommit results
      - uses: j178/prek-action@v3.0.0
      # run pre-commit ci lite for automated fixes
      - uses: pre-commit-ci/lite-action@v1.1.0
        if: ${{ !cancelled() }}
  run_tests:
    needs: pre_commit_checks
    strategy:
      matrix:
        python_version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      OS: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Python setup
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Run pytest
        run: uv run --frozen pytest
  pilot_e2e:
    needs: pre_commit_checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Python setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Pull the CellProfiler container
        run: docker pull cellprofiler/cellprofiler:4.2.8
      - name: Run the full local pilot pipeline e2e test
        run: uv run --frozen pytest tests/test_pilot_e2e.py -m pilot_e2e
